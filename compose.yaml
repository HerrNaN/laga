services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: laga
      POSTGRES_USER: laga
      POSTGRES_PASSWORD: laga
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laga -d laga"]
      interval: 1s
      timeout: 2s
      retries: 10

volumes:
  postgres-data:
